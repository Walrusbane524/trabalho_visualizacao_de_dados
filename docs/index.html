<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game Sales Dashboard</title>
  <link rel="stylesheet" href="./inspector.css">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .full-width { grid-column: span 2; }

    h1 { text-align: center; color: #333; }
  </style>
</head>
<body>

  <h1>Global Game Sales Analytics</h1>

  <div class="dashboard-grid">

    <div class="card full-width">
      <h3>You can select a country to see data from games developed/published there</h3>
    <div id="map-container"></div> </div>

    <div class="card full-width">
      <h3>You can also select a bar to see data from games released on that year</h3>
      <div id="year-filter-container"></div>
    </div>

    <div class="card">
      <div id="pie-chart-container"></div>
    </div>

    <div class="card">
      <div id="top-games-container"></div>
    </div>

    <div class="card">
      <div id="scatter-user-container"></div>
    </div>

    <div class="card">
      <div id="scatter-critic-container"></div>
    </div>

    <div class="card full-width">
      <div id="ribbon-chart-container"></div>
    </div>

  </div>

  <script type="module" src="./index.js"></script>

</body>
</html>
